services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3000}
      DATABASE_URL: mysql://${MYSQL_USER:?set MYSQL_USER}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      ROUTING_TIMEOUT_MS: ${ROUTING_TIMEOUT_MS:-5000}
      AI_LOCAL_MODEL_BASE_URL: ${AI_LOCAL_MODEL_BASE_URL:-http://local-ai:8000}
      AI_LOCAL_MODEL_API_KEY: ${AI_LOCAL_MODEL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - private

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - private

  osrm:
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:?set OSRM_DATASET}
    volumes:
      - ${OSRM_DATA_DIR:-./osrm-data}:/data:ro
    networks:
      - private

  local-ai:
    image: vllm/vllm-openai:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    command: --model ${AI_LOCAL_MODEL_MODEL:?set AI_LOCAL_MODEL_MODEL} --max-model-len ${AI_LOCAL_MODEL_MAX_LEN:-8192}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${AI_LOCAL_MODEL_API_KEY:-}
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - private

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_PORT: ${APP_PORT:-3000}
      OSM_TILE_BACKEND: ${OSM_TILE_BACKEND:?set OSM_TILE_BACKEND}
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  mysql_data:
  model_cache:
